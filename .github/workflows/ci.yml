name: Plugins CI

# Deliberately does NOT rebuild any theme. Plugins and themes are separate: a
# sandboxed plugin reaches a site through the marketplace, not by being
# rebuilt into every theme. A release here lists the new version and then asks
# the provisioned instances to apply their pending plugin updates (the `roll`
# job) — the theme bundles themselves are untouched.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugins-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Formatting
        run: bunx prettier --check .
      - name: JSON / JSONC validity
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git ls-files '*.json' '*.jsonc')
          node bin/check-json.mjs "${FILES[@]}"

  discover:
    name: Discover plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -euo pipefail
          PLUGINS=$(for d in plugins/*/; do if [ -f "$d/emdash-plugin.jsonc" ]; then basename "$d"; fi; done \
            | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$PLUGINS")" >> "$GITHUB_OUTPUT"
          echo "Found: $PLUGINS"

  plugin:
    name: ${{ matrix.plugin }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # Every plugin reports independently — one failure should not hide the
      # state of the others.
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Validate manifest
        working-directory: plugins/${{ matrix.plugin }}
        run: bunx emdash-plugin validate .

      - name: Typecheck
        working-directory: plugins/${{ matrix.plugin }}
        run: bunx tsc --noEmit

      - name: Test
        working-directory: plugins/${{ matrix.plugin }}
        run: bunx vitest run

      - name: Build
        working-directory: plugins/${{ matrix.plugin }}
        run: bunx emdash-plugin build

      # Release = bump the plugin's version and push main. A version that is
      # not on the marketplace yet is bundled and listed (bin/publish-plugin.sh
      # writes the listing directly — the registry's own publish path needs an
      # atproto identity that is not stood up). Already-listed versions are a
      # no-op, so this runs on every push.
      - name: Publish to the marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bin/publish-plugin.sh ${{ matrix.plugin }} | tee publish.log

      - name: Upload bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-bundle
          path: |
            plugins/${{ matrix.plugin }}/dist/*.tar.gz
            plugins/${{ matrix.plugin }}/dist/manifest.json
          # `error`, not `warn`: a bundle step that produced nothing is a
          # broken release path, and a warning in a green run hides it.
          if-no-files-found: error
          retention-days: 30

  # Every provisioned instance applies the plugin updates now available to
  # it: the themes repo's deploy workflow owns the roll (it holds the root
  # control plane's token), so hand it a `plugins-published` event.
  roll:
    name: Roll plugin updates to the instances
    needs: plugin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DISPATCH_TOKEN is not set — instances were not told to update plugins."
            exit 1
          fi
          gh api repos/MahmoodKhalil57/premium-cms-themes/dispatches \
            -f event_type=plugins-published -f "client_payload[sha]=${{ github.sha }}"
          echo "dispatched plugins-published"
